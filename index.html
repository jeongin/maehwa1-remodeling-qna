<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매화마을1단지 리모델링 Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<!-- 세션 복원이 끝날 때까지 덮어두는 화면. 로그인 화면 깜빡임을 막는다. -->
<div id="bootScreen"><div class="spinner"></div></div>

<!-- ── 로그인 게이트 ── -->
<div id="gateScreen">
  <div class="gate-box">
    <div class="gate-logo">🏗</div>
    <div class="gate-title">매화마을1단지<br>리모델링 Q&amp;A</div>
    <div class="gate-sub">주민설명회 사전질의 페이지입니다.<br>동·호수와 휴대폰 뒷자리 4자리로 입장하세요.</div>

    <div class="gate-form" id="residentForm">
      <div class="gate-row">
        <div>
          <label class="gate-label">동</label>
          <input class="gate-input" id="gDong" inputmode="numeric" maxlength="5" placeholder="101">
        </div>
        <div>
          <label class="gate-label">호수</label>
          <input class="gate-input" id="gHo" inputmode="numeric" maxlength="5" placeholder="1503">
        </div>
      </div>
      <label class="gate-label">휴대폰 뒷자리 4자리</label>
      <input class="gate-input" id="gPhone" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      <button class="gate-btn" id="gBtn">입장하기</button>
      <div class="gate-error" id="gateError"></div>
      <div class="gate-hint">처음 입장하시면 입력한 정보로 자동 등록됩니다.<br>다음부터 같은 정보로 입장하세요.</div>
      <div class="gate-switch"><button type="button" id="toAdmin">관리자 로그인</button></div>
    </div>

    <div class="gate-form" id="adminForm" hidden>
      <label class="gate-label">이메일</label>
      <input class="gate-input" id="aEmail" type="email" placeholder="관리자 이메일">
      <label class="gate-label">비밀번호</label>
      <input class="gate-input" id="aPw" type="password" placeholder="비밀번호">
      <button class="gate-btn" id="aBtn">관리자 로그인</button>
      <div class="gate-error" id="adminError"></div>
      <div class="gate-switch"><button type="button" id="toResident">← 조합원 입장으로</button></div>
    </div>
  </div>
</div>

<!-- ── 헤더 ── -->
<header>
  <div class="header-inner">
    <div>
      <div class="header-title">
        🏗 매화마을1단지 리모델링 Q&amp;A
        <span id="roleBadge" class="role-badge" hidden></span>
      </div>
      <div class="header-subtitle">매화마을1단지 리모델링 주택조합</div>
    </div>
    <div class="header-right">
      <div class="sync-status">
        <span class="dot loading" id="syncDot"></span>
        <span id="syncLabel">연결 중...</span>
      </div>
      <button class="btn-header" id="logoutBtn">🔓 로그아웃</button>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="faq">자주 묻는 질문</button>
    <button class="tab" data-tab="board">질문 게시판</button>
  </div>
</header>

<!-- ── 자주 묻는 질문 ── -->
<main id="panel-faq">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="질문이나 답변 내용으로 검색...">
  </div>
  <div class="filter-row" id="faqFilters"></div>
  <div class="stats-bar" id="faqStats"></div>
  <div class="qa-list" id="faqList"><div class="spinner-wrap"><div class="spinner"></div></div></div>
</main>

<!-- ── 질문 게시판 ── -->
<main id="panel-board" hidden>
  <div class="notice" id="boardNotice"></div>
  <div class="filter-row" id="boardFilters"></div>
  <div class="stats-bar" id="boardStats"></div>
  <div class="qa-list" id="boardList"><div class="spinner-wrap"><div class="spinner"></div></div></div>
</main>

<button class="fab" id="fab" hidden>＋</button>

<!-- FAQ 추가/수정 모달 (관리자) -->
<div class="modal-overlay" id="faqModal">
  <div class="modal">
    <div class="modal-title" id="faqModalTitle">새 Q&amp;A 추가</div>
    <div class="form-group">
      <label>카테고리</label>
      <select class="form-control" id="fCategory"></select>
    </div>
    <div class="form-group">
      <label>질문 *</label>
      <textarea class="form-control" id="fQuestion" rows="3" placeholder="자주 묻는 질문 내용"></textarea>
    </div>
    <div class="form-group">
      <label>답변 *</label>
      <textarea class="form-control" id="fAnswer" rows="5" placeholder="공식 답변"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" data-close="faqModal">취소</button>
      <button class="btn-primary" id="faqSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 질문 작성 모달 -->
<div class="modal-overlay" id="postModal">
  <div class="modal">
    <div class="modal-title" id="postModalTitle">질문 작성</div>
    <div class="private-note">🔒 작성한 질문은 <strong>관리자와 작성자 본인만</strong> 볼 수 있습니다.</div>
    <div class="form-group">
      <label>카테고리 *</label>
      <select class="form-control" id="pCategory"></select>
    </div>
    <div class="form-group">
      <label>제목 *</label>
      <input type="text" class="form-control" id="pTitle" maxlength="80" placeholder="질문을 한 줄로 요약해주세요">
    </div>
    <div class="form-group">
      <label>질문 내용 *</label>
      <textarea class="form-control" id="pContent" rows="6" placeholder="궁금한 점을 자세히 적어주세요"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" data-close="postModal">취소</button>
      <button class="btn-primary" id="postSaveBtn">등록</button>
    </div>
  </div>
</div>

<!-- 답변 모달 (관리자) -->
<div class="modal-overlay" id="answerModal">
  <div class="modal">
    <div class="modal-title">답변 등록</div>
    <div class="answer-quote" id="answerQuote"></div>
    <div class="form-group">
      <label>답변 내용</label>
      <textarea class="form-control" id="aContent" rows="6" placeholder="답변을 입력하세요"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" data-close="answerModal">취소</button>
      <button class="btn-primary" id="answerSaveBtn">답변 저장</button>
    </div>
  </div>
</div>

<script type="module" src="assets/app.js"></script>
<script>
  // 모듈 로드 실패 등으로 세션 확인이 끝나지 않으면 로딩 화면에 갇힌다. 안내를 띄운다.
  setTimeout(function () {
    var b = document.getElementById('bootScreen');
    if (b && !b.hidden) b.innerHTML = '<div class="empty-state"><div class="emoji">\u26a0\ufe0f</div>' +
      '<p>연결이 지연되고 있습니다.<br>네트워크를 확인한 뒤 새로고침해 주세요.</p></div>';
  }, 8000);
</script>
</body>
</html>
